AWSTemplateFormatVersion: "2010-09-09"
Description: Borde HTTPS de las APIs DEV. El balanceador vive en templates/foundation/edge.

Parameters:
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EdgeCertificateArn:
    Type: String
  HostedZoneId:
    Type: String
    Default: Z08167243FAUSDUW0Z2KP

Resources:
  Edge:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/foundation/edge/template.yaml
      Parameters:
        PublicSubnetA: !Ref PublicSubnetA
        PublicSubnetB: !Ref PublicSubnetB
        AlbSecurityGroupId: !Ref AlbSecurityGroupId
        EdgeCertificateArn: !Ref EdgeCertificateArn
        HostedZoneId: !Ref HostedZoneId

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt Edge.Outputs.LoadBalancerDnsName
  LoadBalancerArn:
    Value: !GetAtt Edge.Outputs.LoadBalancerArn
  HttpsListenerArn:
    Value: !GetAtt Edge.Outputs.HttpsListenerArn
