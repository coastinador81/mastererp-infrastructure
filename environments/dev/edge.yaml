AWSTemplateFormatVersion: "2010-09-09"
Description: Borde HTTPS de DEV. El balanceador, las reglas y el DNS viven en modules/edge.yaml.

Parameters:
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EdgeCertificateArn:
    Type: String
  StoreCertificateArn:
    Type: String
  HostedZoneId:
    Type: String
    Default: Z08167243FAUSDUW0Z2KP

Resources:
  Edge:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/edge.yaml
      Parameters:
        PublicSubnetA: !Ref PublicSubnetA
        PublicSubnetB: !Ref PublicSubnetB
        AlbSecurityGroupId: !Ref AlbSecurityGroupId
        EdgeCertificateArn: !Ref EdgeCertificateArn
        StoreCertificateArn: !Ref StoreCertificateArn
        HostedZoneId: !Ref HostedZoneId

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt Edge.Outputs.LoadBalancerDnsName
  LoadBalancerArn:
    Value: !GetAtt Edge.Outputs.LoadBalancerArn
  HttpsListenerArn:
    Value: !GetAtt Edge.Outputs.HttpsListenerArn
