AWSTemplateFormatVersion: "2010-09-09"
Description: Webs DEV en Amplify. No forma parte de los stacks ya desplegados.

Parameters:
  HostedZoneDomain:
    Type: String
    Default: uonify.com
  AssociateDomains:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Resources:
  Webs:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/amplify/webs/template.yaml
      Parameters:
        HostedZoneDomain: !Ref HostedZoneDomain
        AssociateDomains: !Ref AssociateDomains

Outputs:
  PortalAppId:
    Value: !GetAtt Webs.Outputs.PortalAppId
  SuperAdminAppId:
    Value: !GetAtt Webs.Outputs.SuperAdminAppId
  AgentsWebAppId:
    Value: !GetAtt Webs.Outputs.AgentsWebAppId
  StorefrontAppId:
    Value: !GetAtt Webs.Outputs.StorefrontAppId
