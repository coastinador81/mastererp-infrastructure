AWSTemplateFormatVersion: "2010-09-09"
Description: PostgreSQL privado de DEV, sin servicios de aplicación.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  Database:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/1.0-plataforma-base/datos/base-de-datos/template.yaml
      Parameters:
        Prefix: mastererp-dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Outputs.Endpoint
  DatabaseSecretArn:
    Value: !GetAtt Database.Outputs.SecretArn
