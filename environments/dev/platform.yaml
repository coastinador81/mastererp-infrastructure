AWSTemplateFormatVersion: "2010-09-09"
Description: Plataforma DEV. Cada pieza está en modules y cada entrada pública usa modules/service.yaml.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Description: Trafico del balanceador hacia las tareas

  Database:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/database.yaml
      Parameters:
        Prefix: mastererp-dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId

  Documents:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/documents.yaml
      Parameters:
        Prefix: mastererp-dev

  Queues:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/queues.yaml
      Parameters:
        Prefix: mastererp-dev

  Identity:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/identity.yaml
      Parameters:
        Prefix: mastererp-dev
        DatabaseSecretArn: !GetAtt Database.Outputs.SecretArn
        DocumentsBucketArn: !GetAtt Documents.Outputs.BucketArn
        AgentQueueArn: !GetAtt Queues.Outputs.QueueArn

  Cluster:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../modules/cluster.yaml
      Parameters:
        Prefix: mastererp-dev

  PortalWeb:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: portal-web
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn

  SuperAdminWeb:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: super-admin-web
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn

  AgentsWeb:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: agents-web
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn

  StorefrontWeb:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: storefront-web
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn

  ClientApi:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: client-api
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn
        TaskRoleArn: !GetAtt Identity.Outputs.DataTaskRoleArn

  AdminApi:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: admin-api
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn
        TaskRoleArn: !GetAtt Identity.Outputs.DataTaskRoleArn

  AgentsApi:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: agents-api
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn
        TaskRoleArn: !GetAtt Identity.Outputs.AgentsTaskRoleArn

  Mcp:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppFromAlbIngress
    Properties:
      TemplateURL: ../../modules/service.yaml
      Parameters:
        Name: mcp
        Prefix: mastererp-dev
        Scope: dev
        VpcId: !Ref VpcId
        PrivateSubnetA: !Ref PrivateSubnetA
        PrivateSubnetB: !Ref PrivateSubnetB
        AppSecurityGroupId: !Ref AppSecurityGroupId
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        ExecutionRoleArn: !GetAtt Identity.Outputs.ExecutionRoleArn
        TaskRoleArn: !GetAtt Identity.Outputs.McpTaskRoleArn

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Outputs.Endpoint
  DatabaseSecretArn:
    Value: !GetAtt Database.Outputs.SecretArn
  DocumentsBucketName:
    Value: !GetAtt Documents.Outputs.BucketName
  AgentQueueUrl:
    Value: !GetAtt Queues.Outputs.QueueUrl
  ClusterName:
    Value: !GetAtt Cluster.Outputs.ClusterName
  PortalWebTargetGroupArn:
    Value: !GetAtt PortalWeb.Outputs.TargetGroupArn
  SuperAdminWebTargetGroupArn:
    Value: !GetAtt SuperAdminWeb.Outputs.TargetGroupArn
  AgentsWebTargetGroupArn:
    Value: !GetAtt AgentsWeb.Outputs.TargetGroupArn
  StorefrontWebTargetGroupArn:
    Value: !GetAtt StorefrontWeb.Outputs.TargetGroupArn
  ClientApiTargetGroupArn:
    Value: !GetAtt ClientApi.Outputs.TargetGroupArn
  AdminApiTargetGroupArn:
    Value: !GetAtt AdminApi.Outputs.TargetGroupArn
  AgentsApiTargetGroupArn:
    Value: !GetAtt AgentsApi.Outputs.TargetGroupArn
  McpTargetGroupArn:
    Value: !GetAtt Mcp.Outputs.TargetGroupArn
