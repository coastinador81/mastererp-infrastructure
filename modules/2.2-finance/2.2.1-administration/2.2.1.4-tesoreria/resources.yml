{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP DEV technical Lambda: tesoreria; no API or database.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev"
      ]
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "TesoreriaArtifactKey": {
      "Type": "String"
    },
    "ExistingAdminApiId": {
      "Type": "String",
      "Default": "qx8nmypdhi",
      "AllowedValues": [
        "qx8nmypdhi"
      ]
    }
  },
  "Resources": {
    "TesoreriaLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/mastererp-${Environment}-adm-tesoreria"
        },
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "WriteOwnLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "TesoreriaLogs",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "TesoreriaLogs",
      "Properties": {
        "FunctionName": {
          "Fn::Sub": "mastererp-${Environment}-adm-tesoreria"
        },
        "Description": "Prueba tecnica; capacidad de negocio no implementada",
        "Runtime": "python3.12",
        "Handler": "handler.lambda_handler",
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 128,
        "Timeout": 5,
        "Role": {
          "Fn::GetAtt": [
            "TesoreriaRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucket"
          },
          "S3Key": {
            "Ref": "TesoreriaArtifactKey"
          }
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaIntegration": {
      "Type": "AWS::ApiGatewayV2::Integration",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "IntegrationType": "AWS_PROXY",
        "IntegrationMethod": "POST",
        "IntegrationUri": {
          "Fn::GetAtt": [
            "TesoreriaFunction",
            "Arn"
          ]
        },
        "PayloadFormatVersion": "2.0",
        "TimeoutInMillis": 5000
      }
    },
    "TesoreriaHealthRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/tesoreria/health",
        "AuthorizationType": "NONE",
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "TesoreriaIntegration"
              }
            ]
          ]
        }
      }
    },
    "TesoreriaApiPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "TesoreriaFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/tesoreria/health"
        }
      }
    }
  },
  "Outputs": {
    "TesoreriaFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "TesoreriaFunction",
          "Arn"
        ]
      }
    }
  }
}
