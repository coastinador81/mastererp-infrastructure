{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP DEV technical Lambda: tesoreria; no API or database.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "TesoreriaArtifactKey": {
      "Type": "String"
    },
    "ExistingAdminApiId": {
      "Type": "String",
      "Default": "qx8nmypdhi"
    },
    "AdminJwtAuthorizerId": {"Type": "String"},
    "DatabaseHost": {"Type": "String"},
    "DatabaseSecretArn": {"Type": "String"},
    "PrivateSubnetIds": {"Type": "CommaDelimitedList"},
    "SecurityGroupIds": {"Type": "CommaDelimitedList"},
    "CognitoIssuer": {"Type": "String"},
    "CognitoClientId": {"Type": "String"}
  },
  "Resources": {
    "TesoreriaLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/mastererp-${Environment}-adm-tesoreria"
        },
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "WriteOwnLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "TesoreriaLogs",
                      "Arn"
                    ]
                  }
                },
                {"Effect":"Allow","Action":"secretsmanager:GetSecretValue","Resource":{"Ref":"DatabaseSecretArn"}},
                {"Effect":"Allow","Action":["ec2:CreateNetworkInterface","ec2:DescribeNetworkInterfaces","ec2:DescribeSubnets","ec2:DeleteNetworkInterface","ec2:AssignPrivateIpAddresses","ec2:UnassignPrivateIpAddresses"],"Resource":"*"}
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "TesoreriaLogs",
      "Properties": {
        "FunctionName": {
          "Fn::Sub": "mastererp-${Environment}-adm-tesoreria"
        },
        "Description": "Finance payment review over controlled PostgreSQL functions",
        "Runtime": "python3.12",
        "Handler": "handler.lambda_handler",
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 128,
        "Timeout": 15,
        "Role": {
          "Fn::GetAtt": [
            "TesoreriaRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucket"
          },
          "S3Key": {
            "Ref": "TesoreriaArtifactKey"
          }
        },
        "VpcConfig":{"SubnetIds":{"Ref":"PrivateSubnetIds"},"SecurityGroupIds":{"Ref":"SecurityGroupIds"}},
        "Environment":{"Variables":{"DATABASE_HOST":{"Ref":"DatabaseHost"},"DATABASE_SECRET_ARN":{"Ref":"DatabaseSecretArn"},"COGNITO_ISSUER":{"Ref":"CognitoIssuer"},"COGNITO_APP_CLIENT_ID":{"Ref":"CognitoClientId"}}},
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "TesoreriaIntegrationRecovered": {
      "Type": "AWS::ApiGatewayV2::Integration",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "IntegrationType": "AWS_PROXY",
        "IntegrationMethod": "POST",
        "IntegrationUri": {
          "Fn::GetAtt": [
            "TesoreriaFunction",
            "Arn"
          ]
        },
        "PayloadFormatVersion": "2.0",
        "TimeoutInMillis": 5000
      }
    },
    "TesoreriaHealthRouteRecovered": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/tesoreria/health",
        "AuthorizationType": "NONE",
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "TesoreriaIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "PendingReceiptsRoute":{"Type":"AWS::ApiGatewayV2::Route","Properties":{"ApiId":{"Ref":"ExistingAdminApiId"},"RouteKey":"GET /v1/companies/{company_id}/finance/receipts/pending","AuthorizationType":"JWT","AuthorizerId":{"Ref":"AdminJwtAuthorizerId"},"Target":{"Fn::Join":["/",["integrations",{"Ref":"TesoreriaIntegrationRecovered"}]]}}},
    "ReviewReceiptRoute":{"Type":"AWS::ApiGatewayV2::Route","Properties":{"ApiId":{"Ref":"ExistingAdminApiId"},"RouteKey":"POST /v1/companies/{company_id}/finance/receipts/{order_id}/review","AuthorizationType":"JWT","AuthorizerId":{"Ref":"AdminJwtAuthorizerId"},"Target":{"Fn::Join":["/",["integrations",{"Ref":"TesoreriaIntegrationRecovered"}]]}}},
    "TesoreriaApiPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "TesoreriaFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/tesoreria/health"
        }
      }
    },
    "TesoreriaReceiptsApiPermission":{"Type":"AWS::Lambda::Permission","Properties":{"FunctionName":{"Ref":"TesoreriaFunction"},"Action":"lambda:InvokeFunction","Principal":"apigateway.amazonaws.com","SourceAccount":{"Ref":"AWS::AccountId"},"SourceArn":{"Fn::Sub":"arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/*/v1/companies/*/finance/receipts*"}}}
  },
  "Outputs": {
    "TesoreriaFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "TesoreriaFunction",
          "Arn"
        ]
      }
    }
  },
  "Metadata": {
    "Recovery": "API SAM Body reimport deleted the former integration/health route. Recreated by this owner; Lambda/role/log/permission physical IDs preserved."
  }
}
