{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Facturas de compra: rutas privadas; se compone en Administracion, no es un stack independiente.",
  "Parameters": {},
  "Resources": {
    "FacturasListRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/compras/facturas",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ComprasIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "FacturasListPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ComprasFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/compras/facturas"
        }
      }
    },
