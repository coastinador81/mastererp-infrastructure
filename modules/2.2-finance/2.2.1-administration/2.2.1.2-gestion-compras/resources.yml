{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP purchase drafts, shared Compras Lambda and private options route.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "ComprasArtifactKey": {
      "Type": "String"
    },
    "ExistingAdminApiId": {
      "Type": "String",
      "Default": "qx8nmypdhi"
    },
    "PartyDatabaseHost": {
      "Type": "String"
    },
    "PartyDatabaseSecretArn": {
      "Type": "String"
    },
    "PartySubnetIds": {
      "Type": "CommaDelimitedList"
    },
    "PartySecurityGroupIds": {
      "Type": "CommaDelimitedList"
    },
    "PartyCognitoIssuer": {
      "Type": "String"
    },
    "PartyClientId": {
      "Type": "String"
    },
    "AdminJwtAuthorizerId": {
      "Type": "String"
    }
  },
  "Resources": {
    "ComprasLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/mastererp-${Environment}-adm-compras"
        },
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "ComprasRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "WriteOwnLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "ComprasLogs",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          },
          {
            "PolicyName": "ReadApplicationSecret",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": {
                    "Ref": "PartyDatabaseSecretArn"
                  }
                }
              ]
            }
          },
          {
            "PolicyName": "LambdaPrivateNetwork",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ec2:CreateNetworkInterface",
                    "ec2:DescribeNetworkInterfaces",
                    "ec2:DescribeSubnets",
                    "ec2:DeleteNetworkInterface",
                    "ec2:AssignPrivateIpAddresses",
                    "ec2:UnassignPrivateIpAddresses"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "ComprasFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "ComprasLogs",
      "Properties": {
        "FunctionName": {
          "Fn::Sub": "mastererp-${Environment}-adm-compras"
        },
        "Description": "Borradores de solicitudes, ordenes y facturas de proveedor; sin aprobacion ni contabilizacion",
        "Runtime": "python3.12",
        "Handler": "handler.lambda_handler",
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 256,
        "Timeout": 15,
        "Role": {
          "Fn::GetAtt": [
            "ComprasRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucket"
          },
          "S3Key": {
            "Ref": "ComprasArtifactKey"
          }
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ],
        "VpcConfig": {
          "SubnetIds": {
            "Ref": "PartySubnetIds"
          },
          "SecurityGroupIds": {
            "Ref": "PartySecurityGroupIds"
          }
        },
        "Environment": {
          "Variables": {
            "ENVIRONMENT": {
              "Ref": "Environment"
            },
            "COGNITO_ISSUER": {
              "Ref": "PartyCognitoIssuer"
            },
            "COGNITO_APP_CLIENT_ID": {
              "Ref": "PartyClientId"
            },
            "DATABASE_HOST": {
              "Ref": "PartyDatabaseHost"
            },
            "DATABASE_SECRET_ARN": {
              "Ref": "PartyDatabaseSecretArn"
            },
            "IDENTITY_DB_ENABLED": "true",
            "REQUIRED_API_SCOPE": {
              "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
            }
          }
        }
      }
    },
    "ComprasIntegrationRecovered": {
      "Type": "AWS::ApiGatewayV2::Integration",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "IntegrationType": "AWS_PROXY",
        "IntegrationMethod": "POST",
        "IntegrationUri": {
          "Fn::GetAtt": [
            "ComprasFunction",
            "Arn"
          ]
        },
        "PayloadFormatVersion": "2.0",
        "TimeoutInMillis": 5000
      }
    },
    "ComprasHealthRouteRecovered": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/compras/health",
        "AuthorizationType": "NONE",
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ComprasIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ComprasApiPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ComprasFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/compras/health"
        }
      }
    },
    "ComprasOptionsRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/compras/opciones",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ComprasIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ComprasOptionsPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ComprasFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/compras/opciones"
        }
      }
    }
  },
  "Outputs": {
    "ComprasFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "ComprasFunction",
          "Arn"
        ]
      }
    }
  },
  "Metadata": {
    "MasterERP": {
      "Composition": [
        "2.2.1.2.2-solicitudes-compra/resources.yml",
        "2.2.1.2.3-ordenes-compra/resources.yml",
        "2.2.1.2.4-facturas-proveedores/resources.yml"
      ]
    }
  }
}
