{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP company-scoped proveedores over canonical tenant parties",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "ProveedoresArtifactKey": {
      "Type": "String"
    },
    "ExistingAdminApiId": {
      "Type": "String",
      "Default": "qx8nmypdhi"
    },
    "PartyDatabaseHost": {
      "Type": "String"
    },
    "PartyDatabaseSecretArn": {
      "Type": "String"
    },
    "PartySubnetIds": {
      "Type": "CommaDelimitedList"
    },
    "PartySecurityGroupIds": {
      "Type": "CommaDelimitedList"
    },
    "PartyCognitoIssuer": {
      "Type": "String"
    },
    "PartyClientId": {
      "Type": "String"
    },
    "AdminJwtAuthorizerId": {
      "Type": "String"
    }
  },
  "Resources": {
    "ProveedoresLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/mastererp-${Environment}-adm-proveedores"
        },
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "ProveedoresRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "WriteOwnLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "ProveedoresLogs",
                      "Arn"
                    ]
                  }
                }
              ]
            }
          },
          {
            "PolicyName": "ReadApplicationSecret",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": {
                    "Ref": "PartyDatabaseSecretArn"
                  }
                }
              ]
            }
          },
          {
            "PolicyName": "LambdaPrivateNetwork",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ec2:CreateNetworkInterface",
                    "ec2:DescribeNetworkInterfaces",
                    "ec2:DescribeSubnets",
                    "ec2:DeleteNetworkInterface",
                    "ec2:AssignPrivateIpAddresses",
                    "ec2:UnassignPrivateIpAddresses"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "ProveedoresFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": "ProveedoresLogs",
      "Properties": {
        "FunctionName": {
          "Fn::Sub": "mastererp-${Environment}-adm-proveedores"
        },
        "Description": "Functional company parties via application-role SQL commands",
        "Runtime": "python3.12",
        "Handler": "handler.lambda_handler",
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 256,
        "Timeout": 15,
        "Role": {
          "Fn::GetAtt": [
            "ProveedoresRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucket"
          },
          "S3Key": {
            "Ref": "ProveedoresArtifactKey"
          }
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          },
          {
            "Key": "ManagedBy",
            "Value": "cloudformation"
          }
        ],
        "VpcConfig": {
          "SubnetIds": {
            "Ref": "PartySubnetIds"
          },
          "SecurityGroupIds": {
            "Ref": "PartySecurityGroupIds"
          }
        },
        "Environment": {
          "Variables": {
            "ENVIRONMENT": {
              "Ref": "Environment"
            },
            "COGNITO_ISSUER": {
              "Ref": "PartyCognitoIssuer"
            },
            "COGNITO_APP_CLIENT_ID": {
              "Ref": "PartyClientId"
            },
            "DATABASE_HOST": {
              "Ref": "PartyDatabaseHost"
            },
            "DATABASE_SECRET_ARN": {
              "Ref": "PartyDatabaseSecretArn"
            },
            "IDENTITY_DB_ENABLED": "true",
            "REQUIRED_API_SCOPE": {
              "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
            }
          }
        }
      }
    },
    "ProveedoresIntegrationRecovered": {
      "Type": "AWS::ApiGatewayV2::Integration",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "IntegrationType": "AWS_PROXY",
        "IntegrationMethod": "POST",
        "IntegrationUri": {
          "Fn::GetAtt": [
            "ProveedoresFunction",
            "Arn"
          ]
        },
        "PayloadFormatVersion": "2.0",
        "TimeoutInMillis": 15000
      }
    },
    "ProveedoresHealthRouteRecovered": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/proveedores/health",
        "AuthorizationType": "NONE",
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ProveedoresIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ProveedoresApiPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ProveedoresFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/proveedores/health"
        }
      }
    },
    "ProveedoresListRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/proveedores",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ProveedoresIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ProveedoresDetailRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "GET /v1/administration/proveedores/{id}",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ProveedoresIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ProveedoresCreateRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "POST /v1/administration/proveedores",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ProveedoresIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ProveedoresUpdateRoute": {
      "Type": "AWS::ApiGatewayV2::Route",
      "Properties": {
        "ApiId": {
          "Ref": "ExistingAdminApiId"
        },
        "RouteKey": "PATCH /v1/administration/proveedores/{id}",
        "AuthorizationType": "JWT",
        "AuthorizerId": {
          "Ref": "AdminJwtAuthorizerId"
        },
        "AuthorizationScopes": [
          {
            "Fn::Sub": "mastererp-${Environment}/identity.spaces.read"
          }
        ],
        "Target": {
          "Fn::Join": [
            "/",
            [
              "integrations",
              {
                "Ref": "ProveedoresIntegrationRecovered"
              }
            ]
          ]
        }
      }
    },
    "ProveedoresGETPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ProveedoresFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/proveedores/*"
        }
      }
    },
    "ProveedoresPOSTPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ProveedoresFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/POST/v1/administration/proveedores"
        }
      }
    },
    "ProveedoresPATCHPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ProveedoresFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/PATCH/v1/administration/proveedores/*"
        }
      }
    },
    "ProveedoresGETListPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "ProveedoresFunction"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingAdminApiId}/$default/GET/v1/administration/proveedores"
        }
      }
    }
  },
  "Outputs": {
    "ProveedoresFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "ProveedoresFunction",
          "Arn"
        ]
      }
    }
  },
  "Metadata": {
    "Recovery": "API SAM Body reimport deleted the former integration/health route. Recreated by this owner; Lambda/role/log/permission physical IDs preserved."
  }
}
