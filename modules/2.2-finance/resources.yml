{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP Finance parent; Administration nested, Accounting and BI documentary reserves",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "AdministrationTemplateUrl": {
      "Type": "String",
      "Description": "Versioned S3 URL of assembled Administration template"
    },
    "ExistingAdminApiId": {
      "Type": "String",
      "Description": "Explicit output from current API owner"
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "ClientesArtifactKey": {
      "Type": "String"
    },
    "VentasArtifactKey": {
      "Type": "String"
    },
    "ProveedoresArtifactKey": {
      "Type": "String"
    },
    "ComprasArtifactKey": {
      "Type": "String"
    },
    "CarteraArtifactKey": {
      "Type": "String"
    },
    "TesoreriaArtifactKey": {
      "Type": "String"
    },
    "ConciliacionArtifactKey": {
      "Type": "String"
    },
    "GastosArtifactKey": {
      "Type": "String"
    },
    "PartyDatabaseHost": {
      "Type": "String"
    },
    "PartyDatabaseSecretArn": {
      "Type": "String"
    },
    "PartySubnetIds": {
      "Type": "CommaDelimitedList"
    },
    "PartySecurityGroupIds": {
      "Type": "CommaDelimitedList"
    },
    "PartyCognitoIssuer": {
      "Type": "String"
    },
    "PartyClientId": {
      "Type": "String"
    },
    "AdminJwtAuthorizerId": {
      "Type": "String"
    },
    "FrontendDomainName": {
      "Type": "String",
      "Default": "finanzas-dev.uonify.com"
    },
    "FrontendHostedZoneId": {
      "Type": "String",
      "Default": "Z08167243FAUSDUW0Z2KP"
    },
    "FrontendCertificateArn": {
      "Type": "String",
      "Default": ""
    },
    "FrontendEnabled": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ]
    },
    "FrontendAgentApiId": {
      "Type": "String",
      "Default": "ebn01q74hh",
      "Description": "Existing DEV API ID; preserve physical owner, no import or replacement"
    },
    "FrontendAdminApiId": {
      "Type": "String",
      "Default": "qx8nmypdhi",
      "Description": "Existing DEV API ID; preserve physical owner, no import or replacement"
    }
  },
  "Resources": {
    "Administration": {
      "Type": "AWS::CloudFormation::Stack",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "TemplateURL": {
          "Ref": "AdministrationTemplateUrl"
        },
        "Parameters": {
          "Environment": {
            "Ref": "Environment"
          },
          "ExistingAdminApiId": {
            "Ref": "ExistingAdminApiId"
          },
          "ArtifactBucket": {
            "Ref": "ArtifactBucket"
          },
          "ClientesArtifactKey": {
            "Ref": "ClientesArtifactKey"
          },
          "VentasArtifactKey": {
            "Ref": "VentasArtifactKey"
          },
          "ProveedoresArtifactKey": {
            "Ref": "ProveedoresArtifactKey"
          },
          "ComprasArtifactKey": {
            "Ref": "ComprasArtifactKey"
          },
          "CarteraArtifactKey": {
            "Ref": "CarteraArtifactKey"
          },
          "TesoreriaArtifactKey": {
            "Ref": "TesoreriaArtifactKey"
          },
          "ConciliacionArtifactKey": {
            "Ref": "ConciliacionArtifactKey"
          },
          "GastosArtifactKey": {
            "Ref": "GastosArtifactKey"
          },
          "PartyDatabaseHost": {
            "Ref": "PartyDatabaseHost"
          },
          "PartyDatabaseSecretArn": {
            "Ref": "PartyDatabaseSecretArn"
          },
          "PartySubnetIds": {
            "Fn::Join": [
              ",",
              {
                "Ref": "PartySubnetIds"
              }
            ]
          },
          "PartySecurityGroupIds": {
            "Fn::Join": [
              ",",
              {
                "Ref": "PartySecurityGroupIds"
              }
            ]
          },
          "PartyCognitoIssuer": {
            "Ref": "PartyCognitoIssuer"
          },
          "PartyClientId": {
            "Ref": "PartyClientId"
          },
          "AdminJwtAuthorizerId": {
            "Ref": "AdminJwtAuthorizerId"
          }
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "administration-health"
          }
        ]
      }
    },
    "FinanceFrontendBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Fn::Sub": "mastererp-${Environment}-finance-web-${AWS::AccountId}-${AWS::Region}"
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "finance-frontend"
          }
        ]
      },
      "Condition": "FinanceFrontend"
    },
    "FinanceFrontendOAC": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Sub": "mastererp-${Environment}-finance-web"
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      },
      "Condition": "FinanceFrontend"
    },
    "FinanceFrontendDistribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "finance-frontend"
          }
        ],
        "DistributionConfig": {
          "Enabled": true,
          "Comment": {
            "Fn::Sub": "MasterERP ${Environment} Finance frontend"
          },
          "Aliases": [
            {
              "Ref": "FrontendDomainName"
            }
          ],
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2",
          "IPV6Enabled": true,
          "PriceClass": "PriceClass_100",
          "Origins": [
            {
              "Id": "FinanceS3",
              "DomainName": {
                "Fn::GetAtt": [
                  "FinanceFrontendBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Ref": "FinanceFrontendOAC"
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            },
            {
              "Id": "ExistingAgentApi",
              "DomainName": {
                "Fn::Sub": "${FrontendAgentApiId}.execute-api.${AWS::Region}.amazonaws.com"
              },
              "CustomOriginConfig": {
                "HTTPSPort": 443,
                "OriginProtocolPolicy": "https-only",
                "OriginSSLProtocols": [
                  "TLSv1.2"
                ]
              }
            },
            {
              "Id": "ExistingAdminApi",
              "DomainName": {
                "Fn::Sub": "${FrontendAdminApiId}.execute-api.${AWS::Region}.amazonaws.com"
              },
              "CustomOriginConfig": {
                "HTTPSPort": 443,
                "OriginProtocolPolicy": "https-only",
                "OriginSSLProtocols": [
                  "TLSv1.2"
                ]
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "FinanceS3",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD"
            ],
            "CachedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6"
          },
          "ViewerCertificate": {
            "AcmCertificateArn": {
              "Ref": "FrontendCertificateArn"
            },
            "SslSupportMethod": "sni-only",
            "MinimumProtocolVersion": "TLSv1.2_2021"
          },
          "CacheBehaviors": [
            {
              "PathPattern": "/v1/uonify/*",
              "TargetOriginId": "ExistingAgentApi",
              "ViewerProtocolPolicy": "https-only",
              "AllowedMethods": [
                "GET",
                "HEAD",
                "OPTIONS",
                "PUT",
                "PATCH",
                "POST",
                "DELETE"
              ],
              "CachedMethods": [
                "GET",
                "HEAD"
              ],
              "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
              "OriginRequestPolicyId": "b689b0a8-53d0-40ab-baf2-68738e2966ac",
              "Compress": true
            },
            {
              "PathPattern": "/v1/administration/*",
              "TargetOriginId": "ExistingAdminApi",
              "ViewerProtocolPolicy": "https-only",
              "AllowedMethods": [
                "GET",
                "HEAD",
                "OPTIONS",
                "PUT",
                "PATCH",
                "POST",
                "DELETE"
              ],
              "CachedMethods": [
                "GET",
                "HEAD"
              ],
              "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
              "OriginRequestPolicyId": "b689b0a8-53d0-40ab-baf2-68738e2966ac",
              "Compress": true
            },
            {
              "PathPattern": "/v1/companies/*",
              "TargetOriginId": "ExistingAdminApi",
              "ViewerProtocolPolicy": "https-only",
              "AllowedMethods": [
                "GET",
                "HEAD",
                "OPTIONS",
                "PUT",
                "PATCH",
                "POST",
                "DELETE"
              ],
              "CachedMethods": [
                "GET",
                "HEAD"
              ],
              "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
              "OriginRequestPolicyId": "b689b0a8-53d0-40ab-baf2-68738e2966ac",
              "Compress": true
            }
          ],
          "CustomErrorResponses": [
            {
              "ErrorCode": 403,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 404,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 500,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 502,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 503,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 504,
              "ErrorCachingMinTTL": 0
            }
          ]
        }
      },
      "Condition": "FinanceFrontend"
    },
    "FinanceFrontendBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "FinanceFrontendBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${FinanceFrontendBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FinanceFrontendDistribution}"
                  }
                }
              }
            },
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "FinanceFrontendBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${FinanceFrontendBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      },
      "Condition": "FinanceFrontend"
    },
    "FinanceFrontendDns": {
      "Type": "AWS::Route53::RecordSetGroup",
      "Properties": {
        "HostedZoneId": {
          "Ref": "FrontendHostedZoneId"
        },
        "RecordSets": [
          {
            "Name": {
              "Ref": "FrontendDomainName"
            },
            "Type": "A",
            "AliasTarget": {
              "HostedZoneId": "Z2FDTNDATAQYW2",
              "DNSName": {
                "Fn::GetAtt": [
                  "FinanceFrontendDistribution",
                  "DomainName"
                ]
              },
              "EvaluateTargetHealth": false
            }
          },
          {
            "Name": {
              "Ref": "FrontendDomainName"
            },
            "Type": "AAAA",
            "AliasTarget": {
              "HostedZoneId": "Z2FDTNDATAQYW2",
              "DNSName": {
                "Fn::GetAtt": [
                  "FinanceFrontendDistribution",
                  "DomainName"
                ]
              },
              "EvaluateTargetHealth": false
            }
          }
        ]
      },
      "Condition": "FinanceFrontend"
    },
    "FinanceFrontendPublisherRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Fn::Sub": "mastererp-${Environment}-finance-frontend-github-role"
        },
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": "repo:eticayservicios@144081289/mastererp-platform@1434968316:ref:refs/heads/dev"
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "publish-finance-only",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "FinanceFrontendBucket",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${FinanceFrontendBucket.Arn}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "cloudfront:CreateInvalidation",
                    "cloudfront:GetInvalidation"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FinanceFrontendDistribution}"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "finance-frontend"
          }
        ]
      },
      "Condition": "FinanceFrontend"
    }
  },
  "Outputs": {
    "AdministrationStackId": {
      "Value": {
        "Ref": "Administration"
      }
    },
    "AdminApiId": {
      "Value": {
        "Ref": "ExistingAdminApiId"
      }
    },
    "AdminApiEndpoint": {
      "Value": {
        "Fn::Sub": "https://${ExistingAdminApiId}.execute-api.${AWS::Region}.amazonaws.com"
      }
    },
    "ClientesFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.ClientesFunctionArn"
        ]
      }
    },
    "VentasFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.VentasFunctionArn"
        ]
      }
    },
    "ProveedoresFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.ProveedoresFunctionArn"
        ]
      }
    },
    "ComprasFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.ComprasFunctionArn"
        ]
      }
    },
    "CarteraFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.CarteraFunctionArn"
        ]
      }
    },
    "TesoreriaFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.TesoreriaFunctionArn"
        ]
      }
    },
    "ConciliacionFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.ConciliacionFunctionArn"
        ]
      }
    },
    "GastosFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Administration",
          "Outputs.GastosFunctionArn"
        ]
      }
    },
    "FrontendBucketName": {
      "Value": {
        "Ref": "FinanceFrontendBucket"
      },
      "Condition": "FinanceFrontend"
    },
    "FrontendDistributionId": {
      "Value": {
        "Ref": "FinanceFrontendDistribution"
      },
      "Condition": "FinanceFrontend"
    },
    "FrontendDistributionDomain": {
      "Value": {
        "Fn::GetAtt": [
          "FinanceFrontendDistribution",
          "DomainName"
        ]
      },
      "Condition": "FinanceFrontend"
    },
    "FrontendPublisherRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "FinanceFrontendPublisherRole",
          "Arn"
        ]
      },
      "Condition": "FinanceFrontend"
    },
    "FrontendUrl": {
      "Value": {
        "Fn::Sub": "https://${FrontendDomainName}"
      },
      "Condition": "FinanceFrontend"
    }
  },
  "Conditions": {
    "FinanceFrontend": {
      "Fn::Equals": [
        {
          "Ref": "FrontendEnabled"
        },
        "true"
      ]
    }
  },
  "Metadata": {
    "FinanceFrontendComposition": {
      "Parameters": [
        "Environment",
        "FrontendDomainName",
        "FrontendHostedZoneId",
        "FrontendCertificateArn",
        "FrontendEnabled",
        "FrontendAgentApiId",
        "FrontendAdminApiId"
      ],
      "Resources": [
        "FinanceFrontendBucket",
        "FinanceFrontendOAC",
        "FinanceFrontendDistribution",
        "FinanceFrontendBucketPolicy",
        "FinanceFrontendDns",
        "FinanceFrontendPublisherRole"
      ],
      "Outputs": [
        "FrontendBucketName",
        "FrontendDistributionId",
        "FrontendDistributionDomain",
        "FrontendPublisherRoleArn",
        "FrontendUrl"
      ]
    }
  }
}
