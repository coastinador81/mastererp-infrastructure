{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MasterERP Inventory independent frontend hosting; us-west-1 DEV",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "FrontendDomainName": {
      "Type": "String",
      "Default": "inventario-dev.uonify.com"
    },
    "FrontendHostedZoneId": {
      "Type": "String",
      "Default": "Z08167243FAUSDUW0Z2KP"
    },
    "FrontendCertificateArn": {
      "Type": "String"
    }
  },
  "Resources": {
    "InventoryFrontendBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Fn::Sub": "mastererp-${Environment}-inventory-web-${AWS::AccountId}-${AWS::Region}"
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "inventory-frontend"
          }
        ]
      }
    },
    "InventoryFrontendOAC": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Sub": "mastererp-${Environment}-inventory-web"
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "InventoryFrontendDistribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "inventory-frontend"
          }
        ],
        "DistributionConfig": {
          "Enabled": true,
          "Comment": {
            "Fn::Sub": "MasterERP ${Environment} Inventory frontend"
          },
          "Aliases": [
            {
              "Ref": "FrontendDomainName"
            }
          ],
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2",
          "IPV6Enabled": true,
          "PriceClass": "PriceClass_100",
          "Origins": [
            {
              "Id": "InventoryS3",
              "DomainName": {
                "Fn::GetAtt": [
                  "InventoryFrontendBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Ref": "InventoryFrontendOAC"
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "InventoryS3",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD"
            ],
            "CachedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6"
          },
          "ViewerCertificate": {
            "AcmCertificateArn": {
              "Ref": "FrontendCertificateArn"
            },
            "SslSupportMethod": "sni-only",
            "MinimumProtocolVersion": "TLSv1.2_2021"
          },
          "CustomErrorResponses": [
            {
              "ErrorCode": 403,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 404,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 500,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 502,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 503,
              "ErrorCachingMinTTL": 0
            },
            {
              "ErrorCode": 504,
              "ErrorCachingMinTTL": 0
            }
          ]
        }
      }
    },
    "InventoryFrontendBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "InventoryFrontendBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${InventoryFrontendBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${InventoryFrontendDistribution}"
                  }
                }
              }
            },
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "InventoryFrontendBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${InventoryFrontendBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    },
    "InventoryFrontendDns": {
      "Type": "AWS::Route53::RecordSetGroup",
      "Properties": {
        "HostedZoneId": {
          "Ref": "FrontendHostedZoneId"
        },
        "RecordSets": [
          {
            "Name": {
              "Ref": "FrontendDomainName"
            },
            "Type": "A",
            "AliasTarget": {
              "HostedZoneId": "Z2FDTNDATAQYW2",
              "DNSName": {
                "Fn::GetAtt": [
                  "InventoryFrontendDistribution",
                  "DomainName"
                ]
              },
              "EvaluateTargetHealth": false
            }
          },
          {
            "Name": {
              "Ref": "FrontendDomainName"
            },
            "Type": "AAAA",
            "AliasTarget": {
              "HostedZoneId": "Z2FDTNDATAQYW2",
              "DNSName": {
                "Fn::GetAtt": [
                  "InventoryFrontendDistribution",
                  "DomainName"
                ]
              },
              "EvaluateTargetHealth": false
            }
          }
        ]
      }
    },
    "InventoryFrontendPublisherRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Fn::Sub": "mastererp-${Environment}-inventory-frontend-github-role"
        },
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": "repo:eticayservicios@144081289/mastererp-platform@1434968316:ref:refs/heads/dev"
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "publish-inventory-only",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "InventoryFrontendBucket",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${InventoryFrontendBucket.Arn}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "cloudfront:CreateInvalidation",
                    "cloudfront:GetInvalidation"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${InventoryFrontendDistribution}"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "MasterERP"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          },
          {
            "Key": "Component",
            "Value": "inventory-frontend"
          }
        ]
      }
    }
  },
  "Outputs": {
    "FrontendBucketName": {
      "Value": {
        "Ref": "InventoryFrontendBucket"
      }
    },
    "FrontendDistributionId": {
      "Value": {
        "Ref": "InventoryFrontendDistribution"
      }
    },
    "FrontendDistributionDomain": {
      "Value": {
        "Fn::GetAtt": [
          "InventoryFrontendDistribution",
          "DomainName"
        ]
      }
    },
    "FrontendPublisherRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "InventoryFrontendPublisherRole",
          "Arn"
        ]
      }
    },
    "FrontendUrl": {
      "Value": {
        "Fn::Sub": "https://${FrontendDomainName}"
      }
    }
  }
}
