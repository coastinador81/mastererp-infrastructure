{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "1.1 Tenant onboarding ? Lambdas y mastererp-{env}-admin-api.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "dev",
      "AllowedValues": [
        "dev",
        "qa",
        "prod"
      ]
    },
    "DatabaseHost": {
      "Type": "String",
      "Default": "pending"
    },
    "DatabaseSecretArn": {
      "Type": "String",
      "Default": ""
    },
    "DatabaseName": {
      "Type": "String",
      "Default": "mastererp"
    },
    "CognitoUserPoolId": {
      "Type": "String",
      "Default": ""
    },
    "CognitoAppClientId": {
      "Type": "String",
      "Default": ""
    },
    "EnableLambdaVpc": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ]
    },
    "AllowedOrigins": {
      "Type": "String",
      "Default": "https://admin.dev.mastererp.local"
    },
    "OnboardingCodeUri": {
      "Type": "String",
      "Default": "../../../../mastererp-platform/services/modules/1.0-platform-base/1.1-tenant-onboarding/"
    },
    "MigratorCodeUri": {
      "Type": "String",
      "Default": "../../../../mastererp-platform/services/platform-base/db-migrator/"
    },
    "VpcSubnetIds": {
      "Type": "CommaDelimitedList"
    },
    "LambdaSecurityGroupIds": {
      "Type": "CommaDelimitedList"
    },
    "ReviewedArtifactBucket": {
      "Type": "String"
    },
    "ReviewedArtifactKey": {
      "Type": "String"
    },
    "AdminJwtIssuer": {
      "Type": "String"
    },
    "AdminJwtAudience": {
      "Type": "String"
    }
  },
  "Outputs": {
    "AdminApiEndpoint": {
      "Description": "Admin HTTP API base URL",
      "Value": {
        "Fn::Sub": "https://${AdminHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
      }
    },
    "AdminApiName": {
      "Value": {
        "Fn::Sub": "mastererp-${Environment}-admin-api"
      }
    },
    "AdminApiId": {
      "Value": {
        "Ref": "AdminHttpApi"
      }
    },
    "DbMigratorFunctionName": {
      "Value": {
        "Ref": "DbMigratorFunction"
      }
    },
    "OnboardingProvisionerFunctionName": {
      "Value": {
        "Ref": "OnboardingProvisionerFunction"
      }
    },
    "AdminJwtAuthorizerId": {
      "Value": {
        "Ref": "AdminCognitoJwtAuthorizer"
      }
    }
  },
  "Metadata": {
    "MasterERP": {
      "Assembly": "scripts/admin_api_model.py",
      "SharedResourceSource": "modules/api-gateways.yml",
      "SharedResourceIds": [
        "AdminHttpApi",
        "AdminHttpApiApiGatewayDefaultStage",
        "AdminCognitoJwtAuthorizer"
      ],
      "DeployStandalone": false,
      "Scope": "existing DEV owner; CREATE forbidden"
    }
  },
  "Resources": {
    "AdminApiLogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/apigateway/mastererp-${Environment}-admin-api"
        },
        "RetentionInDays": 30
      },
      "Metadata": {
        "SamResourceId": "AdminApiLogGroup"
      }
    },
    "SsmAdminApiId": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mastererp/${Environment}/gateways/admin-api-id"
        },
        "Type": "String",
        "Value": {
          "Ref": "AdminHttpApi"
        }
      },
      "Metadata": {
        "SamResourceId": "SsmAdminApiId"
      }
    },
    "DbMigratorFunction": {
      "Type": "AWS::Lambda::Function",
      "Metadata": {
        "SamResourceId": "DbMigratorFunction"
      },
      "Properties": {
        "Code": {
          "S3Bucket": "aws-sam-cli-managed-default-samclisourcebucket-sxnqlc5ufsez",
          "S3Key": "mastererp-dev-onboarding/70f040437eee3c1075eca8c940587d57"
        },
        "FunctionName": {
          "Fn::Sub": "mastererp-${Environment}-db-migrator"
        },
        "Handler": "handler.lambda_handler",
        "MemorySize": 512,
        "Role": {
          "Fn::GetAtt": [
            "DbMigratorFunctionRole",
            "Arn"
          ]
        },
        "Runtime": "python3.12",
        "Timeout": 30,
        "VpcConfig": {
          "Fn::If": [
            "UseLambdaVpc",
            {
              "SubnetIds": {
                "Ref": "VpcSubnetIds"
              },
              "SecurityGroupIds": {
                "Ref": "LambdaSecurityGroupIds"
              }
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "Environment": {
          "Variables": {
            "ENVIRONMENT": {
              "Ref": "Environment"
            },
            "DATABASE_HOST": {
              "Ref": "DatabaseHost"
            },
            "DATABASE_NAME": {
              "Ref": "DatabaseName"
            },
            "DATABASE_SECRET_ARN": {
              "Ref": "DatabaseSecretArn"
            },
            "DATABASE_SSLMODE": "require",
            "COGNITO_USER_POOL_ID": {
              "Ref": "CognitoUserPoolId"
            },
            "COGNITO_APP_CLIENT_ID": {
              "Ref": "CognitoAppClientId"
            },
            "ALLOW_TENANT_SELF_REGISTRATION": "false",
            "AUTH_MODE": "cognito"
          }
        },
        "Tags": [
          {
            "Key": "lambda:createdBy",
            "Value": "SAM"
          }
        ],
        "TracingConfig": {
          "Mode": "Active"
        }
      }
    },
    "DbMigratorFunctionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Action": [
                "sts:AssumeRole"
              ],
              "Effect": "Allow",
              "Principal": {
                "Service": [
                  "lambda.amazonaws.com"
                ]
              }
            }
          ]
        },
        "ManagedPolicyArns": [
          "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole",
          "arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess",
          "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        ],
        "Policies": [
          {
            "PolicyName": "DbMigratorFunctionRolePolicy1",
            "PolicyDocument": {
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": {
                    "Fn::Sub": "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mastererp/*"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "lambda:createdBy",
            "Value": "SAM"
          }
        ]
      }
    },
