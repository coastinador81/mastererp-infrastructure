{
 "AWSTemplateFormatVersion":"2010-09-09","Description":"MasterERP node-scoped Inventory API",
 "Parameters":{"Environment":{"Type":"String","Default":"dev","AllowedValues":["dev","qa","prod"]},"ArtifactBucket":{"Type":"String"},"InventoryArtifactKey":{"Type":"String"},"ExistingAdminApiId":{"Type":"String"},"AdminJwtAuthorizerId":{"Type":"String"},"DatabaseHost":{"Type":"String"},"DatabaseSecretArn":{"Type":"String"},"PrivateSubnetIds":{"Type":"CommaDelimitedList"},"SecurityGroupIds":{"Type":"CommaDelimitedList"},"CognitoIssuer":{"Type":"String"},"CognitoClientId":{"Type":"String"}},
 "Resources":{
