  "InventoryReserveRoute":{"Type":"AWS::ApiGatewayV2::Route","Properties":{"ApiId":{"Ref":"ExistingAdminApiId"},"RouteKey":"POST /v1/companies/{company_id}/nodes/{node_id}/inventory/reservations","AuthorizationType":"JWT","AuthorizerId":{"Ref":"AdminJwtAuthorizerId"},"Target":{"Fn::Join":["/",["integrations",{"Ref":"InventoryIntegration"}]]}}},
  "InventoryFinalizeRoute":{"Type":"AWS::ApiGatewayV2::Route","Properties":{"ApiId":{"Ref":"ExistingAdminApiId"},"RouteKey":"POST /v1/companies/{company_id}/inventory/reservations/{reservation_id}/finalize","AuthorizationType":"JWT","AuthorizerId":{"Ref":"AdminJwtAuthorizerId"},"Target":{"Fn::Join":["/",["integrations",{"Ref":"InventoryIntegration"}]]}}},
