  "InventoryListRoute":{"Type":"AWS::ApiGatewayV2::Route","Properties":{"ApiId":{"Ref":"ExistingAdminApiId"},"RouteKey":"GET /v1/companies/{company_id}/nodes/{node_id}/inventory","AuthorizationType":"JWT","AuthorizerId":{"Ref":"AdminJwtAuthorizerId"},"Target":{"Fn::Join":["/",["integrations",{"Ref":"InventoryIntegration"}]]}}},
