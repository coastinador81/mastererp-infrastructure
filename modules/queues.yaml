AWSTemplateFormatVersion: "2010-09-09"
Description: Cola de flujos de agentes y su cola de errores.

Parameters:
  Prefix:
    Type: String

Resources:
  AgentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Prefix}-agent-flows-dlq
      MessageRetentionPeriod: 1209600

  AgentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${Prefix}-agent-flows
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AgentDeadLetterQueue.Arn
        maxReceiveCount: 5

Outputs:
  QueueUrl:
    Value: !Ref AgentQueue
  QueueArn:
    Value: !GetAtt AgentQueue.Arn
