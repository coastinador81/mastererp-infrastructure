AWSTemplateFormatVersion: '2010-09-09'
Description: MasterERP E-commerce independent DEV frontend hosting
Parameters:
  Environment: {Type: String, Default: dev, AllowedValues: [dev]}
  FrontendDomainName: {Type: String, Default: ecom-dev.uonify.com}
  FrontendHostedZoneId: {Type: String, Default: Z08167243FAUSDUW0Z2KP}
  FrontendCertificateArn: {Type: String}
  IdentityApiId: {Type: String, Default: ebn01q74hh}
  OperationsApiId: {Type: String, Default: qx8nmypdhi}
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub mastererp-${Environment}-ecommerce-web-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      Tags:
        - {Key: Project, Value: MasterERP}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: Component, Value: ecommerce-frontend}
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub mastererp-${Environment}-ecommerce-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - {Key: Project, Value: MasterERP}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: Component, Value: ecommerce-frontend}
      DistributionConfig:
        Enabled: true
        Comment: !Sub MasterERP ${Environment} E-commerce frontend
        Aliases: [!Ref FrontendDomainName]
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: EcommerceS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: IdentityApi
            DomainName: !Sub ${IdentityApiId}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: {HTTPSPort: 443, OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
          - Id: OperationsApi
            DomainName: !Sub ${OperationsApiId}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: {HTTPSPort: 443, OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
        DefaultCacheBehavior:
          TargetOriginId: EcommerceS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /v1/uonify/*
            TargetOriginId: IdentityApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /v1/companies/*
            TargetOriginId: OperationsApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /v1/products*
            TargetOriginId: OperationsApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /v1/catalog/*
            TargetOriginId: OperationsApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate: {AcmCertificateArn: !Ref FrontendCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        CustomErrorResponses:
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition: {StringEquals: {AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'}}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  FrontendDns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref FrontendHostedZoneId
      RecordSets:
        - Name: !Ref FrontendDomainName
          Type: A
          AliasTarget: {HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt FrontendDistribution.DomainName, EvaluateTargetHealth: false}
        - Name: !Ref FrontendDomainName
          Type: AAAA
          AliasTarget: {HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt FrontendDistribution.DomainName, EvaluateTargetHealth: false}
  FrontendPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mastererp-${Environment}-ecommerce-frontend-github-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:eticayservicios@144081289/mastererp-platform@1434968316:ref:refs/heads/dev
      Policies:
        - PolicyName: publish-ecommerce-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: s3:ListBucket, Resource: !GetAtt FrontendBucket.Arn}
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub '${FrontendBucket.Arn}/*'}
              - {Effect: Allow, Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation], Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'}
      Tags:
        - {Key: Project, Value: MasterERP}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: Component, Value: ecommerce-frontend}
Outputs:
  FrontendBucketName: {Value: !Ref FrontendBucket}
  FrontendDistributionId: {Value: !Ref FrontendDistribution}
  FrontendDistributionDomain: {Value: !GetAtt FrontendDistribution.DomainName}
  FrontendPublisherRoleArn: {Value: !GetAtt FrontendPublisherRole.Arn}
  FrontendUrl: {Value: !Sub 'https://${FrontendDomainName}'}
