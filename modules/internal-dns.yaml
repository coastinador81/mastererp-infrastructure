AWSTemplateFormatVersion: "2010-09-09"
Description: Zona privada del MCP interno. Solo resuelve dentro de la VPC.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  ZoneName:
    Type: String

Resources:
  InternalMcpZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref ZoneName
      HostedZoneConfig:
        Comment: MCP interno. Solo resuelve dentro de la VPC.
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region

Outputs:
  InternalMcpZoneId:
    Value: !Ref InternalMcpZone
