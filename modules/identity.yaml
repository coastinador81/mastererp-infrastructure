AWSTemplateFormatVersion: "2010-09-09"
Description: Roles de las tareas. Datos, agentes y MCP no comparten permisos.

Parameters:
  Prefix:
    Type: String
  DatabaseSecretArn:
    Type: String
  DocumentsBucketArn:
    Type: String
  AgentQueueArn:
    Type: String

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  DataTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-task-data
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

  AgentsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-task-agents
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: documents-flows-and-models
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref DocumentsBucketArn
                  - !Sub ${DocumentsBucketArn}/*
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !Ref AgentQueueArn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  McpTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Prefix}-task-mcp
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: enqueue-flows
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !Ref AgentQueueArn

Outputs:
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  DataTaskRoleArn:
    Value: !GetAtt DataTaskRole.Arn
  AgentsTaskRoleArn:
    Value: !GetAtt AgentsTaskRole.Arn
  McpTaskRoleArn:
    Value: !GetAtt McpTaskRole.Arn
