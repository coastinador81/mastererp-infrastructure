AWSTemplateFormatVersion: "2010-09-09"
Description: Nexus DEV static frontend: S3, CloudFront OAC and Route 53.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev]
  FrontendDomainName:
    Type: String
    Default: nexus-dev.uonify.com
  FrontendHostedZoneId:
    Type: String
    Default: Z08167243FAUSDUW0Z2KP
  FrontendCertificateArn:
    Type: String
    Description: DNS-validated ACM certificate ARN created in us-east-1.

Resources:
  NexusFrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub mastererp-${Environment}-nexus-web-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: MasterERP
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: nexus-frontend

  NexusFrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub mastererp-${Environment}-nexus-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  NexusFrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub MasterERP ${Environment} Nexus frontend
        Aliases:
          - !Ref FrontendDomainName
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: NexusS3
            DomainName: !GetAtt NexusFrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref NexusFrontendOac
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: NexusS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Project
          Value: MasterERP
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: nexus-frontend

  NexusFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NexusFrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${NexusFrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${NexusFrontendDistribution}
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt NexusFrontendBucket.Arn
              - !Sub ${NexusFrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  NexusFrontendDns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref FrontendHostedZoneId
      RecordSets:
        - Name: !Ref FrontendDomainName
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt NexusFrontendDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: !Ref FrontendDomainName
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt NexusFrontendDistribution.DomainName
            EvaluateTargetHealth: false

Outputs:
  FrontendBucketName:
    Value: !Ref NexusFrontendBucket
  FrontendDistributionId:
    Value: !Ref NexusFrontendDistribution
  FrontendDistributionDomain:
    Value: !GetAtt NexusFrontendDistribution.DomainName
  FrontendUrl:
    Value: !Sub https://${FrontendDomainName}
