# Uonify DEV origin: origin-dev.uonify.com, behind CloudFront for https://dev.uonify.com/api/*
# (decision D-DEV-HOSTING-20261107). Service "nginx" of compose.yaml, image nginx 1.30.6 alpine.
#
# Only CloudFront reaches this listener (security group: CloudFront origin-facing prefix list),
# and every request, /api/health and the voice WebSocket included, must also carry the
# CloudFront origin custom header X-Origin-Verify. The accepted value(s) are not in this file:
# nginx-entrypoint.sh renders them at container start into /run/nginx-uonify/origin-verify.map.
#
# Edge contract for the CloudFront part: origin protocol https-only (TLSv1.2), SNI and Host =
# origin-dev.uonify.com (origin request policy WITHOUT the viewer Host header), forward Origin,
# Cookie, the query string and the Sec-WebSocket-* headers, no caching, origin read timeout
# <= 180 s, origin keep-alive timeout < 75 s.

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# "crit" on purpose: nginx "error"-level lines quote the whole request line, query string
# included (OAuth ?code=&state=, Drive file names and searches). Upstream failures stay visible
# in the access log (status, upstream_status, upstream timings); startup, config and certificate
# errors are "emerg" and are always logged.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    # Access log without query strings: only $uri (path), never $request, $request_uri, $args or
    # $http_referer. viewer = client IP (last element of CloudFront's X-Forwarded-For, see realip
    # below); edge = CloudFront address that connected; cf_id = CloudFront request id.
    log_format uonify_edge escape=json
        '{"time":"$time_iso8601","viewer":"$remote_addr","edge":"$realip_remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_bytes":$request_length,"duration":$request_time,'
        '"upstream_status":"$upstream_status","upstream_connect":"$upstream_connect_time",'
        '"upstream_duration":"$upstream_response_time","cf_id":"$http_x_amz_cf_id"}';
    access_log /dev/stdout uonify_edge;

    # Longer than CloudFront's origin keep-alive (60 s max), so nginx never closes an idle
    # connection while CloudFront is reusing it.
    keepalive_timeout 75s;
    keepalive_requests 1000;

    # Largest bodies of the API: Estudio and Drive uploads (20 MiB, checked again by the app).
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # Docker's embedded DNS. With a variable in proxy_pass, "api" is resolved again at most every
    # 10 s, so a recreated api container (new IP after a deploy or a rollback) is found again
    # without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $uonify_connection {
        default upgrade;
        ""      close;
    }

    # 1 only for an exact, case-sensitive match of a rendered value; anything else, including a
    # missing header, is 0. A missing or empty map file makes nginx refuse to start.
    map $http_x_origin_verify $uonify_origin_ok {
        default 0;
        include /run/nginx-uonify/origin-verify.map;
    }

    # /api/health is polled through CloudFront by the Route 53 health check: log only failures.
    map $status $uonify_log_unhealthy {
        ~^2     0;
        default 1;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:uonify_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 8443 ssl default_server;     # published as 443 on the host
        server_name origin-dev.uonify.com;

        ssl_certificate     /etc/letsencrypt/live/origin-dev.uonify.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/origin-dev.uonify.com/privkey.pem;

        # The peer is always CloudFront (security group), which appends the address it saw as the
        # LAST element of X-Forwarded-For. With real_ip_recursive off, $remote_addr becomes exactly
        # that last element; earlier elements (client supplied) are ignored.
        set_real_ip_from 0.0.0.0/0;
        set_real_ip_from ::/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        # Gate: without the exact secret header nothing goes through, health check included.
        if ($uonify_origin_ok != "1") {
            return 403 '{"error":"forbidden"}';
        }

        set $uonify_api http://api:8000;

        # Shared by every location below (none of them sets its own proxy_set_header).
        proxy_http_version 1.1;
        # TrustedHostMiddleware of the image only accepts 127.0.0.1, localhost and api.
        proxy_set_header Host api;
        # Overwritten, never appended: one address (the viewer) and the scheme of the viewer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $uonify_connection;
        # The edge secret never reaches the app; Authorization is dropped because the voice
        # bridge rejects any handshake that carries it (the edge gate removes it too).
        proxy_set_header X-Origin-Verify "";
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        # The app builds its redirects from UONIFY_ORIGIN; these only fix framework redirects
        # built from the internal Host (for example a trailing-slash redirect).
        proxy_redirect http://api/ https://dev.uonify.com/;
        proxy_redirect https://api/ https://dev.uonify.com/;
        proxy_redirect http://api:8000/ https://dev.uonify.com/;
        proxy_redirect https://api:8000/ https://dev.uonify.com/;
        proxy_hide_header Server;
        # Session cookies only over HTTPS: the sealed image sets them without Secure (app/security.py),
        # and a browser would send them in clear to http://dev.uonify.com before CloudFront refuses it.
        proxy_cookie_flags ~ secure;
        # HSTS on every answer of this origin, without includeSubDomains (other teams own subdomains
        # of uonify.com). Locations with their own add_header repeat it: nginx does not inherit it there.
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Responses stream as they arrive, as through the Vite proxy on the Mac.
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        location /api/ {
            proxy_pass $uonify_api;
        }

        # Uony Live voice: WebSocket, sessions of up to 8 min plus a 2 min handshake margin.
        location = /api/uony/live {
            proxy_pass $uonify_api;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location = /api/health {
            proxy_pass $uonify_api;
            access_log /dev/stdout uonify_edge if=$uonify_log_unhealthy;
        }

        # The site itself is served by CloudFront from S3; this origin only answers /api/.
        location / {
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 404 '{"error":"not_found"}';
        }

        # Errors generated by nginx itself answer in the JSON shape the frontend expects (only
        # these; JSON errors of the app pass through untouched). api down, unresolvable or too
        # slow is always 503, like the app's own database_unavailable; the access log keeps the
        # real cause in upstream_status (502 or 504).
        error_page 413 @uonify_too_large;
        error_page 502 503 504 =503 @uonify_unavailable;

        location @uonify_too_large {
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 413 '{"error":"body_too_large","message":"Petición demasiado grande."}';
        }

        location @uonify_unavailable {
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 503 '{"error":"service_unavailable","message":"El servicio no está disponible ahora. Inténtalo de nuevo en unos minutos."}';
        }
    }

    # Container healthcheck only: loopback of the nginx container, never published.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        default_type text/plain;

        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
