# Uonify DEV · /etc/systemd/system/docker.service.d/10-uonify.conf (instalado por bootstrap.sh)
# Docker solo arranca con el volumen de datos montado en /data (Postgres vive ahí; si faltara, un
# bind mount crearía una BD vacía en el disco raíz) y después del volcado de secretos.
# uonify-secrets.service se engancha además con RequiredBy=docker.service (systemctl enable).
[Unit]
RequiresMountsFor=/data
After=uonify-secrets.service
