{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Uonify DEV 0.2-app: rol OIDC de GitHub con el que el workflow publish-uonify-web-dev.yml de mastererp-platform (rama dev) publica https://dev.uonify.com (web en S3, funciones de la puerta e invalidaciones). Sin acceso directo a la API del KVS de la puerta, a la configuracion de la distribucion ni a secretos.",
  "Parameters": {
    "GitHubOidcProviderArn": { "Type": "String", "Default": "arn:aws:iam::277352717693:oidc-provider/token.actions.githubusercontent.com" },
    "WebBucketName": { "Type": "String", "Default": "uonify-dev-web-277352717693" },
    "DistributionId": { "Type": "String", "Default": "E4N1UCPZZ2F0" },
    "GateKvsArn": { "Type": "String", "Default": "arn:aws:cloudfront::277352717693:key-value-store/3bdb8df2-d11c-460f-9110-1d97ffb2fda0" }
  },
  "Resources": {
    "WebPublisherRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "uonify-dev-web-github-role",
        "Description": "Publica dev.uonify.com desde mastererp-platform (rama dev). Ver modules/0-uonify/0.2-app/README.md.",
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Federated": { "Ref": "GitHubOidcProviderArn" } },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringLike": {
                  "token.actions.githubusercontent.com:job_workflow_ref": [
                    "eticayservicios/mastererp-platform/.github/workflows/publish-uonify-web-dev.yml@refs/heads/dev",
                    "eticayservicios@144081289/mastererp-platform@1434968316/.github/workflows/publish-uonify-web-dev.yml@refs/heads/dev"
                  ]
                },
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": "repo:eticayservicios@144081289/mastererp-platform@1434968316:ref:refs/heads/dev"
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "uonify-dev-web-publish",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                { "Sid": "WebBucketList", "Effect": "Allow", "Action": "s3:ListBucket", "Resource": { "Fn::Sub": "arn:aws:s3:::${WebBucketName}" } },
                { "Sid": "WebBucketObjects", "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject"], "Resource": { "Fn::Sub": "arn:aws:s3:::${WebBucketName}/*" } },
                { "Sid": "Invalidations", "Effect": "Allow", "Action": ["cloudfront:CreateInvalidation", "cloudfront:GetInvalidation"], "Resource": { "Fn::Sub": "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}" } },
                {
                  "Sid": "GateFunctions",
                  "Effect": "Allow",
                  "Action": ["cloudfront:DescribeFunction", "cloudfront:GetFunction", "cloudfront:UpdateFunction", "cloudfront:TestFunction", "cloudfront:PublishFunction"],
                  "Resource": [
                    { "Fn::Sub": "arn:aws:cloudfront::${AWS::AccountId}:function/uonify-dev-gate-default" },
                    { "Fn::Sub": "arn:aws:cloudfront::${AWS::AccountId}:function/uonify-dev-gate-api" }
                  ]
                },
                { "Sid": "GateKvsMetadataOnly", "Effect": "Allow", "Action": "cloudfront:DescribeKeyValueStore", "Resource": { "Ref": "GateKvsArn" } },
                {
                  "Sid": "NeverSecretsOrDestructive",
                  "Effect": "Deny",
                  "Action": [
                    "cloudfront-keyvaluestore:*",
                    "cloudfront:GetDistribution",
                    "cloudfront:GetDistributionConfig",
                    "cloudfront:ListDistributions*",
                    "cloudfront:UpdateDistribution",
                    "cloudfront:DeleteDistribution",
                    "cloudfront:CreateFunction",
                    "cloudfront:DeleteFunction",
                    "cloudfront:UpdateKeyValueStore",
                    "cloudfront:DeleteKeyValueStore",
                    "s3:DeleteObject",
                    "s3:DeleteObjectVersion",
                    "s3:PutBucketPolicy",
                    "s3:DeleteBucketPolicy",
                    "s3:PutBucketAcl",
                    "s3:PutObjectAcl",
                    "s3:PutBucketVersioning",
                    "s3:PutLifecycleConfiguration",
                    "ssm:*",
                    "secretsmanager:*",
                    "kms:Decrypt",
                    "iam:*"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ],
        "Tags": [
          { "Key": "Project", "Value": "uonify" },
          { "Key": "Environment", "Value": "dev" },
          { "Key": "Module", "Value": "0-uonify/0.2-app" }
        ]
      }
    }
  },
  "Outputs": {
    "WebPublisherRoleArn": { "Value": { "Fn::GetAtt": ["WebPublisherRole", "Arn"] } }
  }
}
