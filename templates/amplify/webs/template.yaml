AWSTemplateFormatVersion: "2010-09-09"
Description: "Cuatro webs en Amplify Hosting. La CDN cachea los assets y revalida el HTML. Las APIs siguen en Fargate, en la misma VPC que PostgreSQL."

Parameters:
  HostedZoneDomain:
    Type: String
    Default: uonify.com
    Description: Zona publica. Cada app toma solo su subdominio y deja la raiz libre.
  AssociateDomains:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true publica los subdominios. Se deja en false hasta que cada app tenga un artefacto, para no mover el DNS del balanceador.

Conditions:
  WithDomains: !Equals [!Ref AssociateDomains, "true"]

Resources:
  Portal:
    Type: AWS::Amplify::App
    Properties:
      Name: mastererp-dev-portal-web
      Platform: WEB
      Description: Portal administrativo. Llama a admin-api.
      EnvironmentVariables:
        - Name: API_ADMIN_URL
          Value: https://admin-api.dev.erp.uonify.com
      CustomRules:
        - Source: "/<*>"
          Target: "/index.html"
          Status: "404-200"
      CustomHeaders: |
        customHeaders:
          - pattern: "**/*.{js,css,woff,woff2,ttf,svg,png,jpg,jpeg,webp,gif,ico}"
            headers:
              - key: Cache-Control
                value: "public, max-age=31536000, immutable"
          - pattern: "/index.html"
            headers:
              - key: Cache-Control
                value: "public, max-age=0, must-revalidate"

  PortalBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt Portal.AppId
      BranchName: dev
      EnableAutoBuild: false
      Stage: DEVELOPMENT
      Framework: Web

  PortalDomain:
    Type: AWS::Amplify::Domain
    Condition: WithDomains
    Properties:
      AppId: !GetAtt Portal.AppId
      DomainName: !Ref HostedZoneDomain
      SubDomainSettings:
        - BranchName: dev
          Prefix: dev.erp

  SuperAdmin:
    Type: AWS::Amplify::App
    Properties:
      Name: mastererp-dev-super-admin-web
      Platform: WEB
      Description: Alta de tenants. Llama a admin-api.
      EnvironmentVariables:
        - Name: API_ADMIN_URL
          Value: https://admin-api.dev.erp.uonify.com
      CustomRules:
        - Source: "/<*>"
          Target: "/index.html"
          Status: "404-200"
      CustomHeaders: |
        customHeaders:
          - pattern: "**/*.{js,css,woff,woff2,ttf,svg,png,jpg,jpeg,webp,gif,ico}"
            headers:
              - key: Cache-Control
                value: "public, max-age=31536000, immutable"
          - pattern: "/index.html"
            headers:
              - key: Cache-Control
                value: "public, max-age=0, must-revalidate"

  SuperAdminBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt SuperAdmin.AppId
      BranchName: dev
      EnableAutoBuild: false
      Stage: DEVELOPMENT
      Framework: Web

  SuperAdminDomain:
    Type: AWS::Amplify::Domain
    Condition: WithDomains
    Properties:
      AppId: !GetAtt SuperAdmin.AppId
      DomainName: !Ref HostedZoneDomain
      SubDomainSettings:
        - BranchName: dev
          Prefix: super.dev.erp

  AgentsWeb:
    Type: AWS::Amplify::App
    Properties:
      Name: mastererp-dev-agents-web
      Platform: WEB
      Description: Centro de agentes. Llama a agents-api.
      EnvironmentVariables:
        - Name: API_AGENTS_URL
          Value: https://agents-api.dev.erp.uonify.com
      CustomRules:
        - Source: "/<*>"
          Target: "/index.html"
          Status: "404-200"
      CustomHeaders: |
        customHeaders:
          - pattern: "**/*.{js,css,woff,woff2,ttf,svg,png,jpg,jpeg,webp,gif,ico}"
            headers:
              - key: Cache-Control
                value: "public, max-age=31536000, immutable"
          - pattern: "/index.html"
            headers:
              - key: Cache-Control
                value: "public, max-age=0, must-revalidate"

  AgentsWebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AgentsWeb.AppId
      BranchName: dev
      EnableAutoBuild: false
      Stage: DEVELOPMENT
      Framework: Web

  AgentsWebDomain:
    Type: AWS::Amplify::Domain
    Condition: WithDomains
    Properties:
      AppId: !GetAtt AgentsWeb.AppId
      DomainName: !Ref HostedZoneDomain
      SubDomainSettings:
        - BranchName: dev
          Prefix: agents.dev.erp

  Storefront:
    Type: AWS::Amplify::App
    Properties:
      Name: mastererp-dev-storefront-web
      Platform: WEB
      Description: Tienda publica. Llama a client-api y no escribe el catalogo.
      EnvironmentVariables:
        - Name: API_CLIENT_URL
          Value: https://client-api.dev.erp.uonify.com
      CustomRules:
        - Source: "/<*>"
          Target: "/index.html"
          Status: "404-200"
      CustomHeaders: |
        customHeaders:
          - pattern: "**/*.{js,css,woff,woff2,ttf,svg,png,jpg,jpeg,webp,gif,ico}"
            headers:
              - key: Cache-Control
                value: "public, max-age=31536000, immutable"
          - pattern: "/index.html"
            headers:
              - key: Cache-Control
                value: "public, max-age=0, must-revalidate"

  StorefrontBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt Storefront.AppId
      BranchName: dev
      EnableAutoBuild: false
      Stage: DEVELOPMENT
      Framework: Web

  StorefrontDomain:
    Type: AWS::Amplify::Domain
    Condition: WithDomains
    Properties:
      AppId: !GetAtt Storefront.AppId
      DomainName: !Ref HostedZoneDomain
      SubDomainSettings:
        - BranchName: dev
          Prefix: store.dev.erp
        - BranchName: dev
          Prefix: "*.store.dev.erp"

Outputs:
  PortalAppId:
    Value: !GetAtt Portal.AppId
  SuperAdminAppId:
    Value: !GetAtt SuperAdmin.AppId
  AgentsWebAppId:
    Value: !GetAtt AgentsWeb.AppId
  StorefrontAppId:
    Value: !GetAtt Storefront.AppId
  PortalDefaultDomain:
    Value: !GetAtt Portal.DefaultDomain
  StorefrontDefaultDomain:
    Value: !GetAtt Storefront.DefaultDomain
