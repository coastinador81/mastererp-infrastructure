AWSTemplateFormatVersion: "2010-09-09"
Description: "Admins. Administracion, operaciones y reportes."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/usuarios/admins
      Type: String
      Value: pendiente
      Description: "Admins. Administracion, operaciones y reportes."

Outputs:
  ModuleParameter:
    Value: !Ref Module
