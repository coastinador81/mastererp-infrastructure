AWSTemplateFormatVersion: "2010-09-09"
Description: "Clientes. Compras, web, app, ecommerce y marketplace."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/usuarios/clientes
      Type: String
      Value: pendiente
      Description: "Clientes. Compras, web, app, ecommerce y marketplace."

Outputs:
  ModuleParameter:
    Value: !Ref Module
