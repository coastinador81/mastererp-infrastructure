AWSTemplateFormatVersion: "2010-09-09"
Description: "Entrada de partners, terceros y APIs externas."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/usuarios/integraciones-externas
      Type: String
      Value: pendiente
      Description: "Entrada de partners, terceros y APIs externas."

Outputs:
  ModuleParameter:
    Value: !Ref Module
