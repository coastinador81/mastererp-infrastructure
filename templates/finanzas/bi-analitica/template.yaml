AWSTemplateFormatVersion: "2010-09-09"
Description: "2.2.3 BI y analitica."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/finanzas/bi-analitica
      Type: String
      Value: pendiente
      Description: "2.2.3 BI y analitica."

Outputs:
  ModuleParameter:
    Value: !Ref Module
