AWSTemplateFormatVersion: "2010-09-09"
Description: "Finanzas. Admin."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/finanzas/admin
      Type: String
      Value: pendiente
      Description: "Finanzas. Admin."

Outputs:
  ModuleParameter:
    Value: !Ref Module
