AWSTemplateFormatVersion: "2010-09-09"
Description: "2.4.1 Website."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.4-digital-sales/2.4.1-website
      Type: String
      Value: pendiente
      Description: "2.4.1 Website."

Outputs:
  ModuleParameter:
    Value: !Ref Module
