AWSTemplateFormatVersion: "2010-09-09"
Description: Correo del cliente.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/identidad/ses
      Type: String
      Value: pendiente
      Description: Correo del cliente.

Outputs:
  ModuleParameter:
    Value: !Ref Module
