AWSTemplateFormatVersion: "2010-09-09"
Description: Proyecto Vertex del cliente.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/identidad/vertex
      Type: String
      Value: pendiente
      Description: Proyecto Vertex del cliente.

Outputs:
  ModuleParameter:
    Value: !Ref Module
