AWSTemplateFormatVersion: "2010-09-09"
Description: Login único con Google.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/identidad/google-oauth
      Type: String
      Value: pendiente
      Description: Login único con Google.

Outputs:
  ModuleParameter:
    Value: !Ref Module
