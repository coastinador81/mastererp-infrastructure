AWSTemplateFormatVersion: "2010-09-09"
Description: "2.10.1 Repartidores. Misma entidad que Operaciones 2.3.4."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.10-transporte/2.10.1-repartidores
      Type: String
      Value: pendiente
      Description: "2.10.1 Repartidores. Misma entidad que Operaciones 2.3.4."

Outputs:
  ModuleParameter:
    Value: !Ref Module
