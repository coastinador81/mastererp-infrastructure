AWSTemplateFormatVersion: "2010-09-09"
Description: "Gateway MCP. Agentes, automatizacion e integraciones. Sin acceso directo a la base."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/gateways/gateway-mcp
      Type: String
      Value: pendiente
      Description: "Gateway MCP. Agentes, automatizacion e integraciones. Sin acceso directo a la base."

Outputs:
  ModuleParameter:
    Value: !Ref Module
