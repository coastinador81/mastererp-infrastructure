AWSTemplateFormatVersion: "2010-09-09"
Description: "API Admin. Tenants, operaciones, modulos internos y reportes."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/gateways/api-admin
      Type: String
      Value: pendiente
      Description: "API Admin. Tenants, operaciones, modulos internos y reportes."

Outputs:
  ModuleParameter:
    Value: !Ref Module
