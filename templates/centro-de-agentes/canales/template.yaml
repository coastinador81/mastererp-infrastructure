AWSTemplateFormatVersion: "2010-09-09"
Description: "Centro de agentes. Canales."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/centro-de-agentes/canales
      Type: String
      Value: pendiente
      Description: "Centro de agentes. Canales."

Outputs:
  ModuleParameter:
    Value: !Ref Module
