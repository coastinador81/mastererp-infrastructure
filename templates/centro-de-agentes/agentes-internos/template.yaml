AWSTemplateFormatVersion: "2010-09-09"
Description: "Centro de agentes. Agentes internos."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/centro-de-agentes/agentes-internos
      Type: String
      Value: pendiente
      Description: "Centro de agentes. Agentes internos."

Outputs:
  ModuleParameter:
    Value: !Ref Module
