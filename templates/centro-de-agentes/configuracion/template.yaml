AWSTemplateFormatVersion: "2010-09-09"
Description: "2.6.10 Configuracion."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/centro-de-agentes/configuracion
      Type: String
      Value: pendiente
      Description: "2.6.10 Configuracion."

Outputs:
  ModuleParameter:
    Value: !Ref Module
