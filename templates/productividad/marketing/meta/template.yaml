AWSTemplateFormatVersion: "2010-09-09"
Description: "Marketing. Meta."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/productividad/marketing/meta
      Type: String
      Value: pendiente
      Description: "Marketing. Meta."

Outputs:
  ModuleParameter:
    Value: !Ref Module
