AWSTemplateFormatVersion: "2010-09-09"
Description: "2.8.5.4 SharePoint."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/productividad/microsoft-365/sharepoint
      Type: String
      Value: pendiente
      Description: "2.8.5.4 SharePoint."

Outputs:
  ModuleParameter:
    Value: !Ref Module
