AWSTemplateFormatVersion: "2010-09-09"
Description: "2.8.4.1 Gmail."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/productividad/google-workspace/gmail
      Type: String
      Value: pendiente
      Description: "2.8.4.1 Gmail."

Outputs:
  ModuleParameter:
    Value: !Ref Module
