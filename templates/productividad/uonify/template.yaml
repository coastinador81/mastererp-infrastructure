AWSTemplateFormatVersion: "2010-09-09"
Description: "Productividad. Uonify."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/productividad/uonify
      Type: String
      Value: pendiente
      Description: "Productividad. Uonify."

Outputs:
  ModuleParameter:
    Value: !Ref Module
