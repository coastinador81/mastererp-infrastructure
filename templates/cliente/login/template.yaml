AWSTemplateFormatVersion: "2010-09-09"
Description: Login, planes y publicación del plan.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/cliente/login
      Type: String
      Value: pendiente
      Description: Login, planes y publicación del plan.

Outputs:
  ModuleParameter:
    Value: !Ref Module
