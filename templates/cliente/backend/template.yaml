AWSTemplateFormatVersion: "2010-09-09"
Description: Backend del frontend. Render, código del plan y el catálogo.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/cliente/backend
      Type: String
      Value: pendiente
      Description: Backend del frontend. Render, código del plan y el catálogo.

Outputs:
  ModuleParameter:
    Value: !Ref Module
