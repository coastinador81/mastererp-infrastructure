AWSTemplateFormatVersion: "2010-09-09"
Description: "2.3.3 Rutas."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.3-operaciones/2.3.3-rutas
      Type: String
      Value: pendiente
      Description: "2.3.3 Rutas."

Outputs:
  ModuleParameter:
    Value: !Ref Module
