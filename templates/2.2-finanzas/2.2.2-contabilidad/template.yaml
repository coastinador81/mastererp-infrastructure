AWSTemplateFormatVersion: "2010-09-09"
Description: "2.2.2 Contabilidad."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.2-finanzas/2.2.2-contabilidad
      Type: String
      Value: pendiente
      Description: "2.2.2 Contabilidad."

Outputs:
  ModuleParameter:
    Value: !Ref Module
