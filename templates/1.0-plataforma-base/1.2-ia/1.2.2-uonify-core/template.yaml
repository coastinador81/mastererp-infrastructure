AWSTemplateFormatVersion: "2010-09-09"
Description: "1.2.2 Uonify Core: conversación, hilos, voz, memoria contextual, selección de modelos, guardas, orquestación y ejecución controlada de herramientas."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/1.0-plataforma-base/1.2-ia/1.2.2-uonify-core
      Type: String
      Value: pendiente
      Description: "Uonify Core: conversación, hilos, voz, memoria contextual, selección de modelos, guardas, orquestación y ejecución controlada de herramientas."

Outputs:
  ModuleParameter:
    Value: !Ref Module
