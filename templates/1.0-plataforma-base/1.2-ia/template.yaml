AWSTemplateFormatVersion: "2010-09-09"
Description: "1.2 IA transversal. Orquestacion, modelos y conocimiento por tenant."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/1.0-plataforma-base/1.2-ia
      Type: String
      Value: pendiente
      Description: "1.2 IA transversal. Orquestacion, modelos y conocimiento por tenant."

Outputs:
  ModuleParameter:
    Value: !Ref Module
