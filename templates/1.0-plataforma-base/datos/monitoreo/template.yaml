AWSTemplateFormatVersion: "2010-09-09"
Description: "Datos compartidos. Monitoreo y logging."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/1.0-plataforma-base/datos/monitoreo
      Type: String
      Value: pendiente
      Description: "Datos compartidos. Monitoreo y logging."

Outputs:
  ModuleParameter:
    Value: !Ref Module
