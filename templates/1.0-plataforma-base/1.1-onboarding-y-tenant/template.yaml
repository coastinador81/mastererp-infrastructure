AWSTemplateFormatVersion: "2010-09-09"
Description: "1.1 Onboarding y Tenant. Registro, activacion, permisos y modulos contratados."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/1.0-plataforma-base/1.1-onboarding-y-tenant
      Type: String
      Value: pendiente
      Description: "1.1 Onboarding y Tenant. Registro, activacion, permisos y modulos contratados."

Outputs:
  ModuleParameter:
    Value: !Ref Module
