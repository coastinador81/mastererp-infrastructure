AWSTemplateFormatVersion: "2010-09-09"
Description: Redis. Caché de sesión, solo dentro de la red.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/datos/redis
      Type: String
      Value: pendiente
      Description: Redis. Caché de sesión, solo dentro de la red.

Outputs:
  ModuleParameter:
    Value: !Ref Module
