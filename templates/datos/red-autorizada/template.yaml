AWSTemplateFormatVersion: "2010-09-09"
Description: Red autorizada con salida a internet.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/datos/red-autorizada
      Type: String
      Value: pendiente
      Description: Red autorizada con salida a internet.

Outputs:
  ModuleParameter:
    Value: !Ref Module
