AWSTemplateFormatVersion: "2010-09-09"
Description: "2.1.2 Categorias."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/catalogo/categorias
      Type: String
      Value: pendiente
      Description: "2.1.2 Categorias."

Outputs:
  ModuleParameter:
    Value: !Ref Module
