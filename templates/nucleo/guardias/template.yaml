AWSTemplateFormatVersion: "2010-09-09"
Description: "Guardias de entrada: sesión, anti-fuga y límite."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/nucleo/guardias
      Type: String
      Value: pendiente
      Description: "Guardias de entrada: sesión, anti-fuga y límite."

Outputs:
  ModuleParameter:
    Value: !Ref Module
