AWSTemplateFormatVersion: "2010-09-09"
Description: Wiz. Centro de acuse de la compilación en vivo.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/nucleo/wiz/centro-ack
      Type: String
      Value: pendiente
      Description: Wiz. Centro de acuse de la compilación en vivo.

Outputs:
  ModuleParameter:
    Value: !Ref Module
