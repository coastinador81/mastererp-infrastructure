AWSTemplateFormatVersion: "2010-09-09"
Description: Worker de mensajería.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/nucleo/workers/messaging-gateway
      Type: String
      Value: pendiente
      Description: Worker de mensajería.

Outputs:
  ModuleParameter:
    Value: !Ref Module
