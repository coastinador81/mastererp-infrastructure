AWSTemplateFormatVersion: "2010-09-09"
Description: Motor de herramientas. Resolvedor de argumentos.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/nucleo/motor/argument-resolver
      Type: String
      Value: pendiente
      Description: Motor de herramientas. Resolvedor de argumentos.

Outputs:
  ModuleParameter:
    Value: !Ref Module
