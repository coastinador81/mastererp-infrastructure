AWSTemplateFormatVersion: "2010-09-09"
Description: Análisis de uso.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/costos/analisis
      Type: String
      Value: pendiente
      Description: Análisis de uso.

Outputs:
  ModuleParameter:
    Value: !Ref Module
