AWSTemplateFormatVersion: "2010-09-09"
Description: Margen de las pruebas.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/costos/margen
      Type: String
      Value: pendiente
      Description: Margen de las pruebas.

Outputs:
  ModuleParameter:
    Value: !Ref Module
