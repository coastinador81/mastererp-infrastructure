AWSTemplateFormatVersion: "2010-09-09"
Description: "2.5.2 Fabricacion."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.5-servicios/2.5.2-fabricacion
      Type: String
      Value: pendiente
      Description: "2.5.2 Fabricacion."

Outputs:
  ModuleParameter:
    Value: !Ref Module
