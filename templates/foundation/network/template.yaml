AWSTemplateFormatVersion: "2010-09-09"
Description: Red privada mínima para PostgreSQL.

Parameters:
  Prefix:
    Type: String
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
  PrivateSubnetACidr:
    Type: String
    Default: 10.40.10.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.40.11.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Clientes autorizados de PostgreSQL; sin acceso por defecto.
      VpcId: !Ref Vpc
      SecurityGroupEgress: []

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
