AWSTemplateFormatVersion: "2010-09-09"
Description: "Gateway APIs. Entrada de client-api y admin-api."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/acceso/gateway-apis
      Type: String
      Value: pendiente
      Description: "Gateway APIs. Entrada de client-api y admin-api."

Outputs:
  ModuleParameter:
    Value: !Ref Module
