AWSTemplateFormatVersion: "2010-09-09"
Description: "Actor Admins. Quien opera el ERP."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/acceso/admins
      Type: String
      Value: pendiente
      Description: "Actor Admins. Quien opera el ERP."

Outputs:
  ModuleParameter:
    Value: !Ref Module
