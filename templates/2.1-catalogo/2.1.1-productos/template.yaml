AWSTemplateFormatVersion: "2010-09-09"
Description: "2.1.1 Productos."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/2.1-catalogo/2.1.1-productos
      Type: String
      Value: pendiente
      Description: "2.1.1 Productos."

Outputs:
  ModuleParameter:
    Value: !Ref Module
