AWSTemplateFormatVersion: "2010-09-09"
Description: "Canales digitales. Ecommerce."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/canales-digitales/ecommerce
      Type: String
      Value: pendiente
      Description: "Canales digitales. Ecommerce."

Outputs:
  ModuleParameter:
    Value: !Ref Module
