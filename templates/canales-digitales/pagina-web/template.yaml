AWSTemplateFormatVersion: "2010-09-09"
Description: "2.4.1 Pagina web."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/canales-digitales/pagina-web
      Type: String
      Value: pendiente
      Description: "2.4.1 Pagina web."

Outputs:
  ModuleParameter:
    Value: !Ref Module
