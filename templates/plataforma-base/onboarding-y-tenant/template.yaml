AWSTemplateFormatVersion: "2010-09-09"
Description: "Onboarding y tenant."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/plataforma-base/onboarding-y-tenant
      Type: String
      Value: pendiente
      Description: "Onboarding y tenant."

Outputs:
  ModuleParameter:
    Value: !Ref Module
