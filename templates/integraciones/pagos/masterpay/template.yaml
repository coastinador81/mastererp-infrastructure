AWSTemplateFormatVersion: "2010-09-09"
Description: "Pagos MasterPay. Misma capacidad que Finanzas 2.2.4."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/integraciones/pagos/masterpay
      Type: String
      Value: pendiente
      Description: "Pagos MasterPay. Misma capacidad que Finanzas 2.2.4."

Outputs:
  ModuleParameter:
    Value: !Ref Module
