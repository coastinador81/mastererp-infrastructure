AWSTemplateFormatVersion: "2010-09-09"
Description: "Tiendas locales."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/integraciones/marketplaces/tiendas-locales
      Type: String
      Value: pendiente
      Description: "Tiendas locales."

Outputs:
  ModuleParameter:
    Value: !Ref Module
