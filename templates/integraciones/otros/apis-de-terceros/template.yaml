AWSTemplateFormatVersion: "2010-09-09"
Description: "APIs de terceros."

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

Resources:
  Module:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /mastererp/${Environment}/integraciones/otros/apis-de-terceros
      Type: String
      Value: pendiente
      Description: "APIs de terceros."

Outputs:
  ModuleParameter:
    Value: !Ref Module
