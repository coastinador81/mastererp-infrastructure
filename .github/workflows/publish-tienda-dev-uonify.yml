name: Legacy storefront bootstrap (manual only)
on:
  workflow_dispatch:
# Platform owns application publication. This legacy static bootstrap must not
# overwrite the Expo application when Infrastructure paths or templates change.
permissions:
  contents: read
  id-token: write
concurrency:
  group: mastererp-dev-storefront-frontend
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277352717693:role/mastererp-dev-storefront-frontend-github-role
          aws-region: us-west-1
      - name: Package index.html
        run: cp modules/2.3-ecommerce/2.3.2-stores/storefront-static/index.html index.html
      - name: Publish to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.STOREFRONT_UONIFY_BUCKET }}
          DISTRIBUTION: ${{ vars.STOREFRONT_UONIFY_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "${BUCKET:-}" && test -n "${DISTRIBUTION:-}"
          test "$(aws sts get-caller-identity --query Account --output text)" = 277352717693
          aws s3 cp index.html "s3://$BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate'
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths / /index.html --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation"
